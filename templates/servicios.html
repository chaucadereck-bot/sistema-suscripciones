<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Gestión de Servicios</title>

<style>
body {
    background-color: #f4f6f9;
    font-size: 14px;
}

.table thead {
    background-color: #212529;
    color: white;
}

.badge-id {
    background-color: #e9ecef;
    padding: 6px 10px;
    border-radius: 6px;
    font-weight: 500;
}

.card-container {
    border-radius: 12px;
}

.btn-xs {
    padding: 4px 8px;
    font-size: 12px;
}
</style>
</head>

<body>
<div class="container mt-4">

<h4 class="fw-bold mb-4">Gestión de Servicios</h4>

<div class="mb-3">
    <a href="/servicios/nuevo" class="btn btn-success btn-sm shadow-sm">
        + Nuevo Servicio
    </a>
</div>

<div class="card shadow-sm card-container">
<div class="card-body p-0">

<table class="table table-hover text-center align-middle mb-0">

<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Precio</th>
<th>Costo</th>
<th>Duración (meses)</th>
<th>Acciones</th>
</tr>
</thead>

<tbody>

{% for s in servicios %}
<tr>

<td>
<span class="badge-id">
{{ s[0] }}
</span>
</td>

<td>{{ s[1] }}</td>
<td>${{ s[2] }}</td>
<td>${{ s[3] }}</td>
<td>{{ s[4] }}</td>

<td>
<a href="/servicios/editar/{{ s[0] }}"
   class="btn btn-outline-primary btn-xs me-1">
   Editar
</a>

<a href="/servicios/eliminar/{{ s[0] }}"
   class="btn btn-outline-danger btn-xs"
   onclick="return confirm('¿Seguro que deseas eliminar este servicio?');">
   Eliminar
</a>
</td>

</tr>
{% endfor %}

</tbody>

</table>

</div>
</div>

<div class="mt-4">
<a href="/" class="btn btn-secondary btn-sm shadow-sm">
Volver al Panel
</a>
</div>

</div>
</body>
</html>
