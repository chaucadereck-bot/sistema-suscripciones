<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Ventas Contables</title>
</head>
<body class="bg-light">
<div class="container mt-4">

<h3>Ventas Contables</h3>

<table class="table table-bordered table-striped">
<thead class="table-dark">
<tr>
<th>Código</th>
<th>Fecha</th>
<th>Cliente</th>
<th>Teléfono</th>
<th>Servicio</th>
<th>Ingreso</th>
<th>Utilidad</th>
<th>Método Pago</th>
<th>Nota Venta</th>
</tr>
</thead>
<tbody>

{% for d in datos %}
<tr>
<td>{{ d[0] }}</td>
<td>{{ d[1] }}</td>
<td>{{ d[2] }}</td>
<td>{{ d[3] }}</td>
<td>{{ d[4] }}</td>
<td>${{ d[5] }}</td>
<td>${{ d[6] }}</td>
<td>{{ d[7] }}</td>
<td>{{ d[8] if d[8] else "-" }}</td>
</tr>
{% endfor %}

</tbody>
</table>

<a href="/contabilidad" class="btn btn-secondary">Volver</a>

</div>
</body>
</html>
