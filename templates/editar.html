<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Editar Cliente</title>
</head>
<body class="bg-light">
<div class="container mt-4">

<h3>Editar Cliente</h3>

<form method="POST">

<input type="date" name="fecha" value="{{ registro[1] }}" class="form-control mb-2" required>

<input name="cliente" value="{{ registro[4] }}" class="form-control mb-2" required>

<input name="telefono" value="{{ registro[5] }}" class="form-control mb-2" required>

<label>Servicio:</label>
<select name="servicio" class="form-control mb-2" required>
    {% for s in servicios %}
        <option value="{{ s[0] }}"
            {% if registro[6] == s[0] %}selected{% endif %}>
            {{ s[1] }}
        </option>
    {% endfor %}
</select>

<!-- Campos automáticos ocultos -->
<input name="duracion_meses" type="hidden">
<input name="precio" type="hidden">
<input name="fecha_vencimiento" type="hidden">

<input name="correo_cuenta" type="email" value="{{ registro[8] }}" class="form-control mb-2" required>

<select name="estado" class="form-control mb-2">
<option value="activo" {% if registro[9]=='activo' %}selected{% endif %}>Activo</option>
<option value="inactivo" {% if registro[9]=='inactivo' %}selected{% endif %}>Inactivo</option>
<option value="vencido" {% if registro[9]=='vencido' %}selected{% endif %}>Vencido</option>
</select>

<button class="btn btn-primary">Actualizar</button>
<a href="/" class="btn btn-secondary">Volver</a>

</form>

</div>
</body>
</html>
