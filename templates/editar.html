<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Editar Cliente</title>

<style>
body {
    background-color: #f4f6f9;
    font-size: 14px;
}

.card {
    border-radius: 12px;
}

.section-title {
    font-weight: 600;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Editar Cliente</h4>
    <a href="/" class="btn btn-secondary btn-sm shadow-sm">Volver</a>
</div>

<div class="card shadow-sm p-4">

<form method="POST">

<!-- ===================== -->
<!-- DATOS GENERALES -->
<!-- ===================== -->
<div class="section-title">Datos Generales</div>

<div class="row mb-3">

<div class="col-md-4">
<label class="form-label">Fecha Inicio</label>
<input type="date"
       name="fecha"
       value="{{ registro[1] }}"
       class="form-control"
       required>
</div>

<div class="col-md-4">
<label class="form-label">Servicio</label>
<select name="servicio"
        class="form-select"
        required>
    {% for s in servicios %}
        <option value="{{ s[0] }}"
            {% if registro[6] == s[0] %}selected{% endif %}>
            {{ s[1] }}
        </option>
    {% endfor %}
</select>
</div>

<div class="col-md-4">
<label class="form-label">Estado</label>
<select name="estado"
        class="form-select">
        <option value="activo" {% if registro[9]=='activo' %}selected{% endif %}>Activo</option>
        <option value="inactivo" {% if registro[9]=='inactivo' %}selected{% endif %}>Inactivo</option>
        <option value="vencido" {% if registro[9]=='vencido' %}selected{% endif %}>Vencido</option>
</select>
</div>

</div>

<div class="row mb-3">

<div class="col-md-6">
<label class="form-label">Cliente</label>
<input name="cliente"
       value="{{ registro[4] }}"
       class="form-control"
       required>
</div>

<div class="col-md-6">
<label class="form-label">Teléfono</label>
<input name="telefono"
       value="{{ registro[5] }}"
       class="form-control"
       required>
</div>

</div>

<div class="mb-3">
<label class="form-label">Correo Cuenta</label>
<input name="correo_cuenta"
       type="email"
       value="{{ registro[8] }}"
       class="form-control"
       required>
</div>

<hr>

<div class="d-flex justify-content-end mt-3">

<button type="submit"
        class="btn btn-primary btn-sm shadow-sm me-2"
        onclick="this.disabled=true; this.innerText='Actualizando...'; this.form.submit();">
Actualizar
</button>

<a href="/"
   class="btn btn-outline-secondary btn-sm">
Cancelar
</a>

</div>

</form>

</div>
</div>

</body>
</html>
