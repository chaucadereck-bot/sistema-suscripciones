<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Renovar Suscripción</title>

<style>
body {
    background-color: #f4f6f9;
    font-size: 14px;
}

.card {
    border-radius: 12px;
}

.section-title {
    font-weight: 600;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Renovar Suscripción</h4>
    <a href="/" class="btn btn-secondary btn-sm shadow-sm">Volver</a>
</div>

<div class="card shadow-sm p-4">

<form method="POST" enctype="multipart/form-data">

<!-- ===================== -->
<!-- INFORMACIÓN -->
<!-- ===================== -->
<div class="section-title">Información</div>

<div class="row mb-3">

<div class="col-md-6">
<label class="form-label">Código</label>
<input type="text" class="form-control" value="{{ codigo }}" readonly>
</div>

<div class="col-md-6">
<label class="form-label">Cliente</label>
<input type="text" class="form-control" value="{{ cliente }}" readonly>
</div>

</div>

<hr>

<!-- ===================== -->
<!-- DATOS DE PAGO -->
<!-- ===================== -->
<div class="section-title">Datos de Pago</div>

<div class="mb-3">
<label class="form-label fw-bold">Monto Pago a Tercero (USDT) *</label>
<input type="number"
       step="0.01"
       name="monto_tercero"
       class="form-control"
       required>
</div>

<div class="row mb-3">

<div class="col-md-6">
<label class="form-label">Proveedor existente</label>
<select name="proveedor_select" class="form-select">
    <option value="">Seleccionar proveedor</option>
    {% for p in proveedores %}
        <option value="{{ p[0] }}">{{ p[0] }}</option>
    {% endfor %}
</select>
</div>

<div class="col-md-6">
<label class="form-label">O nuevo proveedor</label>
<input type="text"
       name="proveedor_nuevo"
       class="form-control"
       placeholder="Proveedor nuevo (opcional)">
</div>

</div>

<hr>

<!-- ===================== -->
<!-- COMPROBANTE -->
<!-- ===================== -->
<div class="section-title">Comprobante</div>

<div class="mb-3">
<label class="form-label fw-bold">
Comprobante Bancario *
</label>
<input type="file"
       name="comprobante_banco"
       class="form-control"
       accept="image/*,.pdf"
       required>
</div>

<hr>

<div class="d-flex justify-content-end mt-3">

<button type="submit"
        class="btn btn-primary btn-sm shadow-sm me-2"
        onclick="this.disabled=true; this.innerText='Procesando...'; this.form.submit();">
Confirmar Renovación
</button>

<a href="/"
   class="btn btn-outline-secondary btn-sm">
Cancelar
</a>

</div>

</form>

</div>
</div>

</body>
</html>
