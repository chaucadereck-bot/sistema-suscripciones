<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Agregar Cliente</title>
</head>
<body class="bg-light">
<div class="container mt-4">

<h3>Agregar Cliente</h3>

<form method="POST">

<!-- Código automático -->
<input name="codigo_venta" class="form-control mb-2" value="{{ codigo }}" readonly>

<!-- Fecha inicio -->
<label>Fecha Inicio:</label>
<input type="date" name="fecha" class="form-control mb-2" required>

<!-- Cliente -->
<input name="cliente" class="form-control mb-2" placeholder="Cliente" required>

<!-- Teléfono -->
<input name="telefono" class="form-control mb-2" placeholder="Teléfono" required>

<!-- Servicio -->
<label>Servicio:</label>
<select name="servicio" class="form-control mb-2" required>
    <option value="">Seleccione un servicio</option>
    {% for s in servicios %}
        <option value="{{ s[0] }}">{{ s[1] }}</option>
    {% endfor %}
</select>

<!-- Estos campos serán sobrescritos automáticamente -->
<input name="duracion_meses" type="hidden">
<input name="precio" type="hidden">
<input name="fecha_vencimiento" type="hidden">

<!-- Correo -->
<input name="correo_cuenta" type="email" class="form-control mb-2" placeholder="Correo Cuenta" required>

<!-- Estado -->
<select name="estado" class="form-control mb-2">
<option value="activo">Activo</option>
<option value="inactivo">Inactivo</option>
<option value="vencido">Vencido</option>
</select>

<button class="btn btn-success">Guardar</button>
<a href="/" class="btn btn-secondary">Volver</a>

</form>

</div>
</body>
</html>
