<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Agregar Cliente</title>
</head>
<body class="bg-light">
<div class="container mt-4">

<h3>Agregar Cliente</h3>

<form method="POST">
<input name="codigo_venta" class="form-control mb-2" value="{{ codigo }}" readonly>
<input type="date" name="fecha" class="form-control mb-2" required>
<input name="duracion_meses" type="number" class="form-control mb-2" placeholder="Duración Meses" required>
<input type="date" name="fecha_vencimiento" class="form-control mb-2" required>
<input name="cliente" class="form-control mb-2" placeholder="Cliente" required>
<input name="telefono" class="form-control mb-2" placeholder="Teléfono" required>
<input name="servicio" class="form-control mb-2" placeholder="Servicio" required>
<input name="precio" type="number" class="form-control mb-2" placeholder="Precio" required>
<input name="correo_cuenta" type="email" class="form-control mb-2" placeholder="Correo Cuenta" required>
<select name="estado" class="form-control mb-2">
<option value="activo">Activo</option>
<option value="inactivo">Inactivo</option>
<option value="vencido">Vencido</option>
</select>

<button class="btn btn-success">Guardar</button>
<a href="/" class="btn btn-secondary">Volver</a>
</form>

</div>
</body>
</html>
