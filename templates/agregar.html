{% extends "base.html" %}

{% block title %}Agregar Cliente{% endblock %}
{% block header %}Agregar Nuevo Cliente{% endblock %}

{% block content %}

<div class="container-fluid">

<div class="card form-card">

<div class="card-body">

<form method="POST" enctype="multipart/form-data">

<div class="row g-3">

<div class="col-md-3">
<label class="form-label">Código Venta</label>
<input type="text" name="codigo_venta" class="form-control" value="{{ codigo }}" readonly>
</div>

<div class="col-md-3">
<label class="form-label">Fecha</label>
<input type="date" name="fecha" class="form-control" required>
</div>

<div class="col-md-6">
<label class="form-label">Cliente</label>
<input type="text" name="cliente" class="form-control" required>
</div>

<div class="col-md-4">
<label class="form-label">Teléfono</label>
<input type="text" name="telefono" class="form-control">
</div>

<div class="col-md-4">
<label class="form-label">Servicio</label>
<select name="servicio" class="form-select" required>

{% for s in servicios %}

<option value="{{ s[0] }}">{{ s[1] }}</option>
{% endfor %}

</select>
</div>

<div class="col-md-4">
<label class="form-label">Correo Cuenta</label>
<input type="email" name="correo_cuenta" class="form-control">
</div>

<div class="col-md-6">
<label class="form-label">Proveedor existente</label>
<select name="proveedor_select" class="form-select">

<option value="">Seleccionar proveedor</option>

{% for p in proveedores %}

<option value="{{ p[0] }}">{{ p[0] }}</option>
{% endfor %}

</select>
</div>

<div class="col-md-6">
<label class="form-label">Nuevo proveedor</label>
<input type="text" name="proveedor_nuevo" class="form-control">
</div>

<div class="col-md-6">
<label class="form-label">Comprobante Bancario</label>
<input type="file" name="comprobante_banco" class="form-control" required>
</div>

<div class="col-md-6">
<label class="form-label">Nota de Venta (opcional)</label>
<input type="file" name="nota_venta" class="form-control">
</div>

</div>

<div class="mt-4">

<button type="submit" class="btn btn-primary">
Guardar Cliente
</button>

<a href="/" class="btn btn-secondary">
Cancelar
</a>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
