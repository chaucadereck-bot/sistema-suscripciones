{% extends "base.html" %}

{% block title %}Editar Cliente{% endblock %}
{% block header %}Editar Cliente{% endblock %}

{% block content %}

<div class="container-fluid">

<div class="card form-card">

<div class="card-body">

<form method="POST">

<div class="row g-3">

<div class="col-md-3">
<label class="form-label">Código Venta</label>
<input type="text" class="form-control" value="{{ registro[0] }}" readonly>
</div>

<div class="col-md-3">
<label class="form-label">Fecha</label>
<input type="date" name="fecha" class="form-control" value="{{ registro[1] }}" required>
</div>

<div class="col-md-6">
<label class="form-label">Cliente</label>
<input type="text" name="cliente" class="form-control" value="{{ registro[4] }}" required>
</div>

<div class="col-md-4">
<label class="form-label">Teléfono</label>
<input type="text" name="telefono" class="form-control" value="{{ registro[5] }}">
</div>

<div class="col-md-4">
<label class="form-label">Servicio</label>
<select name="servicio" class="form-select" required>

{% for s in servicios %}

<option value="{{ s[0] }}" {% if s[0] == registro[6] %}selected{% endif %}>
{{ s[1] }}
</option>

{% endfor %}

</select>
</div>

<div class="col-md-4">
<label class="form-label">Correo Cuenta</label>
<input type="email" name="correo_cuenta" class="form-control" value="{{ registro[8] }}">
</div>

</div>

<div class="mt-4">

<button type="submit" class="btn btn-primary">
Guardar Cambios
</button>

<a href="/" class="btn btn-secondary">
Cancelar
</a>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
