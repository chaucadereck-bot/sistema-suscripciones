{% extends "base.html" %}

{% block title %}Editar Cliente{% endblock %}
{% block header %}Editar Cliente{% endblock %}

{% block content %}

<div class="card form-card">

<div class="card-header">

<div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

<div class="form-title">
Editar Información del Cliente
</div>

<div class="text-muted small">
Modificar datos del registro
</div>

</div>

</div>

<div class="card-body">

<form method="POST">

<div class="row g-4">

<div class="col-xl-3 col-md-4">

<label class="form-label">
Código Venta
</label>

<input
type="text"
class="form-control"
value="{{ registro[0] }}"
readonly>

</div>

<div class="col-xl-3 col-md-4">

<label class="form-label">
Fecha
</label>

<input
type="date"
name="fecha"
class="form-control"
value="{{ registro[1] }}"
required>

</div>

<div class="col-xl-6 col-md-12">

<label class="form-label">
Cliente
</label>

<input
type="text"
name="cliente"
class="form-control"
value="{{ registro[4] }}"
required>

</div>

<div class="col-xl-4 col-md-6">

<label class="form-label">
Teléfono
</label>

<input
type="text"
name="telefono"
class="form-control"
value="{{ registro[5] }}"
placeholder="Número de contacto">

</div>

<div class="col-xl-4 col-md-6">

<label class="form-label">
Servicio
</label>

<select name="servicio" class="form-select" required>

{% for s in servicios %}

<option value="{{ s[0] }}" {% if s[0] == registro[6] %}selected{% endif %}>
{{ s[1] }}
</option>

{% endfor %}

</select>

</div>

<div class="col-xl-4 col-md-12">

<label class="form-label">
Correo de la cuenta
</label>

<input
type="email"
name="correo_cuenta"
class="form-control"
value="{{ registro[8] }}"
placeholder="correo@ejemplo.com">

</div>

</div>


<!-- BOTONES -->

<div class="form-actions mt-4 d-flex flex-wrap gap-2">

<button type="submit" class="btn btn-primary">

<i class="bi bi-check-lg me-1"></i>
Guardar Cambios

</button>

<a href="/" class="btn btn-outline-secondary">

<i class="bi bi-arrow-left me-1"></i>
Cancelar

</a>

</div>

</form>

</div>

</div>

{% endblock %}
