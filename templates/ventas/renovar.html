{% extends "base.html" %}

{% block title %}Renovar Cliente{% endblock %}
{% block header %}Renovar Servicio{% endblock %}

{% block content %}

<div class="container-fluid">

<div class="card form-card">

<div class="card-body">

<form method="POST" enctype="multipart/form-data">

<div class="row g-3">

<div class="col-md-6">
<label class="form-label">Código Venta</label>
<input type="text" class="form-control" value="{{ codigo }}" readonly>
</div>

<div class="col-md-6">
<label class="form-label">Cliente</label>
<input type="text" class="form-control" value="{{ cliente }}" readonly>
</div>

<div class="col-md-6">
<label class="form-label">Proveedor existente</label>
<select name="proveedor_select" class="form-select">

<option value="">Seleccionar proveedor</option>

{% for p in proveedores %}

<option value="{{ p[0] }}">{{ p[0] }}</option>
{% endfor %}

</select>
</div>

<div class="col-md-6">
<label class="form-label">Nuevo proveedor</label>
<input type="text" name="proveedor_nuevo" class="form-control">
</div>

<div class="col-md-6">
<label class="form-label">Monto pagado al tercero (USDT)</label>
<input type="number" step="0.01" name="monto_tercero" class="form-control" required>
</div>

<div class="col-md-6">
<label class="form-label">Comprobante Bancario</label>
<input type="file" name="comprobante_banco" class="form-control" required>
</div>

</div>

<div class="mt-4">

<button type="submit" class="btn btn-warning">
Renovar Servicio
</button>

<a href="/" class="btn btn-secondary">
Cancelar
</a>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
