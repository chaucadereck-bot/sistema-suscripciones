{% extends "base.html" %}

{% block title %}Renovar Cliente{% endblock %}
{% block header %}Renovar Servicio{% endblock %}

{% block content %}

<div class="card form-card">

<div class="card-header">
<div class="form-title">
Renovación de Servicio
</div>
</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">


<!-- INFORMACIÓN DEL CLIENTE -->

<div class="section-title mb-2">
Información del Cliente
</div>

<div class="row g-4">

<div class="col-md-6">
<label class="form-label">Código Venta</label>
<input
type="text"
class="form-control"
value="{{ codigo }}"
readonly>
</div>

<div class="col-md-6">
<label class="form-label">Cliente</label>
<input
type="text"
class="form-control"
value="{{ cliente }}"
readonly>
</div>

</div>


<hr class="my-4">


<!-- PROVEEDOR -->

<div class="section-title mb-2">
Proveedor del Servicio
</div>

<div class="row g-4">

<div class="col-md-6">
<label class="form-label">Proveedor existente</label>
<select name="proveedor_select" class="form-select">

<option value="">Seleccionar proveedor</option>

{% for p in proveedores %}
<option value="{{ p[0] }}">{{ p[0] }}</option>
{% endfor %}

</select>
</div>

<div class="col-md-6">
<label class="form-label">Nuevo proveedor</label>
<input
type="text"
name="proveedor_nuevo"
class="form-control"
placeholder="Si no existe, escribe el proveedor">
</div>

</div>


<hr class="my-4">


<!-- INFORMACIÓN DE PAGO -->

<div class="section-title mb-2">
Pago al Proveedor
</div>

<div class="row g-4">

<div class="col-md-6">
<label class="form-label">Monto pagado al tercero (USDT)</label>
<input
type="number"
step="0.01"
name="monto_tercero"
class="form-control"
placeholder="Ej: 15.50"
required>
</div>

<div class="col-md-6">
<label class="form-label">Comprobante Bancario</label>
<input
type="file"
name="comprobante_banco"
class="form-control"
required>
</div>

</div>


<div class="form-actions mt-4 d-flex gap-2">

<button type="submit" class="btn btn-warning">
Renovar Servicio
</button>

<a href="/" class="btn btn-outline-secondary">
Cancelar
</a>

</div>

</form>

</div>

</div>

{% endblock %}
