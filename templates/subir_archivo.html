{% extends "base.html" %}

{% block title %}Subir Archivo{% endblock %}
{% block header %}Subir Archivo{% endblock %}

{% block content %}

<div class="container-fluid">

<div class="card form-card">

<div class="card-body text-center">

<form method="POST" enctype="multipart/form-data">

<input 
type="file" 
name="archivo" 
id="archivoInput" 
style="display:none"
required
onchange="document.getElementById('nombreArchivo').innerText = this.files[0].name"
>

<div class="mb-3">

<button 
type="button" 
class="btn btn-secondary"
onclick="document.getElementById('archivoInput').click()"
>
Seleccionar archivo
</button>

<p id="nombreArchivo" class="mt-2 text-muted">
Ningún archivo seleccionado
</p>

</div>

<div class="mt-3">

<button type="submit" class="btn btn-success">
Subir Archivo
</button>

<a href="{{ request.referrer }}" class="btn btn-secondary">
Cancelar
</a>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
