<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subir Archivo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #f4f6f9;
    font-size: 14px;
}
.card {
    border-radius: 12px;
}
.section-title {
    font-weight: 600;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Subir Archivo</h4>
    <a href="{{ request.referrer or url_for('ventas_contables') }}" 
       class="btn btn-secondary btn-sm shadow-sm">
        Volver
    </a>
</div>

<div class="card shadow-sm p-4">

<div class="section-title">
    Tipo: <strong>{{ tipo }}</strong><br>
    ID: <strong>{{ identificador }}</strong>
</div>

<form method="POST"
      enctype="multipart/form-data"
      action="{{ url_for('subir_archivo', tipo=tipo, identificador=identificador) }}">

    <input type="hidden" name="tipo" value="{{ tipo }}">
    <input type="hidden" name="identificador" value="{{ identificador }}">

    <div class="mb-3">
        <label class="form-label fw-bold">Seleccionar archivo *</label>
        <input type="file"
               name="archivo"
               class="form-control"
               accept="image/*,.pdf"
               required>
    </div>

    <div class="d-flex justify-content-end">

        <button type="submit"
                class="btn btn-primary btn-sm shadow-sm me-2"
                onclick="this.disabled=true; this.innerText='Subiendo...'; this.form.submit();">
            Guardar
        </button>

        <a href="{{ request.referrer or url_for('ventas_contables') }}"
           class="btn btn-outline-secondary btn-sm">
           Cancelar
        </a>

    </div>

</form>

</div>
</div>

</body>
</html>
