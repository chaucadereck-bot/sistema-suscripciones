<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Pagos a Terceros</title>

<style>
table td {
    vertical-align: middle !important;
}

.btn-sm {
    padding: 3px 8px;
    font-size: 0.8rem;
}
</style>

</head>

<body class="bg-light">
<div class="container mt-4">

<h3>Pagos a Terceros</h3>

<table class="table table-bordered table-striped align-middle">
<thead class="table-dark">
<tr>
<th>ID Pago</th>
<th>Código Venta</th>
<th>Fecha Pago</th>
<th>Monto (USDT)</th>
<th>Proveedor</th>
<th>Comprobante Binance</th>
</tr>
</thead>

<tbody>

{% for d in datos %}
<tr>

<td>{{ d[0] }}</td>
<td>{{ d[1] }}</td>
<td>{{ d[2] }}</td>
<td>${{ d[3] }}</td>
<td>{{ d[4] }}</td>

<!-- COMPROBANTE BINANCE -->
<td class="text-center">

{% if d[5] %}
    <a href="{{ d[5] }}" target="_blank"
       class="btn btn-sm btn-outline-primary">
        Ver
    </a>
{% else %}
    <form action="/subir-archivo/pago_binance/{{ d[1] }}"
          method="POST"
          enctype="multipart/form-data">

        <input type="file"
               name="archivo"
               id="file_binance_{{ loop.index }}"
               hidden required>

        <label for="file_binance_{{ loop.index }}"
               class="btn btn-sm btn-primary">
            Subir
        </label>

    </form>
{% endif %}

</td>

</tr>
{% endfor %}

</tbody>
</table>

<a href="/contabilidad" class="btn btn-secondary">Volver</a>

</div>
</body>
</html>
