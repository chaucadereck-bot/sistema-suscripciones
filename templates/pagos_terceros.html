<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Pagos a Terceros</title>
</head>
<body class="bg-light">
<div class="container mt-4">

<h3>Pagos a Terceros</h3>

<table class="table table-bordered table-striped">
<thead class="table-dark">
<tr>
<th>ID Pago</th>
<th>Código Venta</th>
<th>Fecha Pago</th>
<th>Monto (USDT)</th>
<th>Proveedor</th>
</tr>
</thead>
<tbody>

{% for d in datos %}
<tr>
<td>{{ d[0] }}</td>
<td>{{ d[1] }}</td>
<td>{{ d[2] }}</td>
<td>${{ d[3] }}</td>
<td>{{ d[4] }}</td>
</tr>
{% endfor %}

</tbody>
</table>

<a href="/contabilidad" class="btn btn-secondary">Volver</a>

</div>
</body>
</html>
