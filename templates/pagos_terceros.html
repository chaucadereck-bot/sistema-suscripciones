<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Pagos a Terceros</title>

<style>
body {
    background-color: #f4f6f9;
    font-size: 14px;
}

.table thead {
    background-color: #212529;
    color: white;
}

.table-hover tbody tr:hover {
    background-color: #f1f3f5;
}

.badge-id {
    background-color: #e9ecef;
    padding: 6px 10px;
    border-radius: 6px;
    font-weight: 500;
}

.card-container {
    border-radius: 12px;
}

.btn-xs {
    padding: 4px 8px;
    font-size: 12px;
}
</style>

</head>

<body>
<div class="container mt-4">

<h4 class="fw-bold mb-4">Pagos a Terceros</h4>

<div class="card shadow-sm card-container">
<div class="card-body p-0">

<table class="table table-hover text-center align-middle mb-0">

<thead>
<tr>
<th>#</th>
<th>ID Pago</th>
<th>Código Venta</th>
<th>Fecha</th>
<th>Monto (USDT)</th>
<th>Proveedor</th>
<th>Comprobante</th>
</tr>
</thead>

<tbody>

{% for p in datos %}
<tr>

<td>{{ loop.index }}</td>

<td>
<span class="badge-id">
{{ p[0] }}
</span>
</td>

<td>{{ p[1] }}</td>
<td>{{ p[2] }}</td>
<td>${{ p[3] }}</td>
<td>{{ p[4] }}</td>

<td>

{% if p[5] %}
    <a href="{{ p[5] }}"
       class="btn btn-success btn-xs mb-1"
       target="_blank">
       Ver
    </a>
{% endif %}

<form action="{{ url_for('subir_archivo', tipo='pago_binance', identificador=p[0]) }}"
      method="POST"
      enctype="multipart/form-data"
      style="display:inline;">

    <input type="file"
           name="archivo"
           id="binance_{{ p[0] }}"
           style="display:none;"
           onchange="this.form.submit()">

    <button type="button"
            class="btn btn-outline-primary btn-xs"
            onclick="document.getElementById('binance_{{ p[0] }}').click();">

        {% if p[5] %}
            Reemplazar
        {% else %}
            Subir
        {% endif %}
    </button>

</form>

</td>

</tr>
{% endfor %}

</tbody>
</table>

</div>
</div>

<div class="mt-4">
<a href="{{ url_for('contabilidad') }}"
   class="btn btn-secondary btn-sm shadow-sm me-2">
   Volver a Contabilidad
</a>

<a href="/"
   class="btn btn-dark btn-sm shadow-sm">
   Ir al Panel
</a>
</div>

</div>
</body>
</html>
